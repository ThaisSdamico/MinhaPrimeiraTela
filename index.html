<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>Login</title>
</head>
<body>
    <!-- <h1>Olá, mundo!</h1> --> <!-- SHIFT + ALT + A -->
     <div id="login">
        <!-- A caixa que contem os elementos -->
        <div class= "caixa">
            <!-- Estes são os elementos do HTML -->
             <img src="./img/logo-senai.png" alt="Logo do Senai">
             <!-- Elemento de Imagem -->
             <h1>Login</h1>
             <!-- Elemento de Titulo de nivel 1 (usar apena uma vez) -->
             <!--tags de formulário-->
             <div class="email"> <!-- Campo (Input) do E-mail -->
                <input type="email" placeholder="Login">
             </div>
              
             <div class="senha"> <!-- Campo (Input) da Senha -->
                <input type="password" placeholder="Senha">
             </div>

             <div class="entrar"> <!-- Botão entrar (submit) -->
                <input type="submit" value="Entrar">
                <p>Não possui conta? <a href="./Cadastro.html">Cadastre-se</a></p>   <!-- <"b>" tag negrito -->
             </div>

            <div class="recuperacao-senha"> <!-- Botão de recuperação de senha -->
                <p>Esqueceu sua senha? <a href="./Recuperacao.html">Recupere Aqui</a></p>
            </div>
        
         </div>
      </div>

</body>
</html>
